# Dependency updates, weekly and grouped so they arrive as few PRs.
# New releases wait 14 days (cooldown) before Dependabot offers them;
# security updates are not delayed.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
