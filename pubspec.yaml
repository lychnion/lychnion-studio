name: lychnion_studio
description: >-
  Tools for publishers: turn your own web pages into a Lychnion guide (a
  knowledge package), check it, then sign and publish it with the
  Lychnion desktop app. Pure Dart.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lychnion/lychnion-studio

environment:
  sdk: ^3.12.2

dependencies:
  html: ^0.15.7
  sqlite3: ^3.5.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
